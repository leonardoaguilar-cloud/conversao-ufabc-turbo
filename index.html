    <!-- Snippet de evento: página de obrigado (conversão) — disparado em /obrigado após envio do formulário em todas as abas -->
    <script>
      (function() {
        function fireThankYouEvent() {
          if (window.location.pathname !== '/obrigado') return;
          if (typeof gtag !== 'function') return;
          gtag('event', 'conversion', {
            'send_to': 'AW-XXXXXXXXXX/YYYYYYYYYYY',
            'event_category': 'lead',
            'event_label': 'diagnostico_gratuito'
          });
          gtag('event', 'generate_lead', {
            'event_category': 'lead',
            'event_label': 'diagnostico_gratuito'
          });
        }
        if (document.readyState === 'complete') fireThankYouEvent();
        else window.addEventListener('load', fireThankYouEvent);
      })();
    </script>
